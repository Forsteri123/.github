name: Shared MC Publish

on:
  workflow_call:
    secrets:
      CURSEFORGE_TOKEN:
        required: true
      MODRINTH_TOKEN:
        required: true

jobs:
  publish:
    if: startsWith(github.event.head_commit.message, 'Bump version')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Build Mod
        run: ./gradlew build

      - name: Parse Metadata
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          JAR_PATH=$(ls build/libs/*.jar | grep -v "\-sources" | grep -v "\-dev" | grep -v "\-slim" | head -n 1 || true)
          if [ -z "$JAR_PATH" ]; then echo "Error: JAR not found"; exit 1; fi
          echo "jar_path=$JAR_PATH" >> "$GITHUB_OUTPUT"

          LOADER="forge"
          FULL_VER=""
          if unzip -l "$JAR_PATH" | grep -q "META-INF/neoforge.mods.toml"; then
            LOADER="neoforge"
            FULL_VER=$(unzip -p "$JAR_PATH" META-INF/neoforge.mods.toml | grep -E "^[[:space:]]*version=" | head -n 1 | cut -d'"' -f2 || true)
          elif unzip -l "$JAR_PATH" | grep -q "META-INF/mods.toml"; then
            LOADER="forge"
            FULL_VER=$(unzip -p "$JAR_PATH" META-INF/mods.toml | grep -E "^[[:space:]]*version=" | grep -v "^[[:space:]]*#" | head -n 1 | cut -d'"' -f2 || true)
          fi

          MOD_VER=$(echo "$FULL_VER" | cut -d'-' -f1)
          MC_VER=$(echo "$FULL_VER" | cut -d'-' -f2)

          if [ -z "$MC_VER" ]; then
            MC_VER=$(echo "$JAR_PATH" | grep -oE '[0-9]+\.[0-9]+(\.[0-9]+)?' | tail -n 1)
            MOD_VER=$(echo "$JAR_PATH" | sed "s/.*-\(.*\)-$MC_VER.jar/\1/")
          fi

          CF_VER_ID=$(curl -s -H "X-Api-Token: ${{ secrets.CURSEFORGE_TOKEN }}" https://minecraft.curseforge.com/api/game/versions | jq -r ".[] | select(.name == \"$MC_VER\") | .id" | head -n 1)
          if [ -z "$CF_VER_ID" ]; then CF_VER_ID="10236"; fi

          echo "loader=$LOADER" >> "$GITHUB_OUTPUT"
          echo "cf_ver_id=$CF_VER_ID" >> "$GITHUB_OUTPUT"
          echo "mc_ver=$MC_VER" >> "$GITHUB_OUTPUT"
          echo "mod_ver=$MOD_VER" >> "$GITHUB_OUTPUT"
          echo "display_name=${MC_VER} v${MOD_VER}" >> "$GITHUB_OUTPUT"

          echo "Resolved jar=$JAR_PATH loader=$LOADER mc=$MC_VER mod=$MOD_VER"
          echo "${{ github.event.head_commit.message }}" | sed '1d' > changelog.md

      - name: Upload to CurseForge
        if: ${{ vars.CURSEFORGE_PROJECT != '' }}
        env:
          CF_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
          CF_PROJECT: ${{ vars.CURSEFORGE_PROJECT }}
        run: |
          METADATA=$(jq -n --arg cl "$(cat changelog.md)" --arg dn "${{ steps.meta.outputs.display_name }}" --arg v "${{ steps.meta.outputs.cf_ver_id }}" \
            '{changelog: $cl, changelogType: "markdown", displayName: $dn, gameVersions: [$v | tonumber], releaseType: "release"}')
          curl -X POST "https://minecraft.curseforge.com/api/projects/${CF_PROJECT}/upload-file" -H "X-Api-Token: ${CF_TOKEN}" -F "metadata=${METADATA}" -F "file=@${{ steps.meta.outputs.jar_path }}"

      - name: Upload to Modrinth
        if: ${{ vars.MODRINTH_PROJECT != '' }}
        env:
          MR_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          MR_PROJECT: ${{ vars.MODRINTH_PROJECT }}
        run: |
          METADATA=$(jq -n --arg name "${{ steps.meta.outputs.display_name }}" --arg ver "${{ steps.meta.outputs.mod_ver }}" --arg cl "$(cat changelog.md)" --arg pid "${MR_PROJECT}" --arg mc "${{ steps.meta.outputs.mc_ver }}" --arg loader "${{ steps.meta.outputs.loader }}" \
            '{name: $name, version_number: $ver, changelog: $cl, dependencies: [], featured: false, status: "listed", game_versions: [$mc], version_type: "release", loaders: [$loader], project_id: $pid, file_parts: ["file"]}')
          curl -X POST "https://api.modrinth.com/v2/version" -H "Authorization: ${MR_TOKEN}" -F "data=${METADATA}" -F "file=@${{ steps.meta.outputs.jar_path }}"
