name: Shared MC Publish

on:
  workflow_call:
    secrets:
      CURSEFORGE_TOKEN:
        required: true
      MODRINTH_TOKEN:
        required: true

jobs:
  publish:
    if: startsWith(github.event.head_commit.message, 'Bump version')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Detect JDK
        id: jdk
        shell: bash
        run: |
          set -euo pipefail
          JAVA_VER=21
          if [ -f gradle/wrapper/gradle-wrapper.properties ]; then
            GW=$(grep -E '^distributionUrl=' gradle/wrapper/gradle-wrapper.properties | grep -oE 'gradle-[0-9]+\.[0-9]+' | head -n 1 | cut -d- -f2)
            MAJOR=$(echo "$GW" | cut -d. -f1)
            MINOR=$(echo "$GW" | cut -d. -f2)
            if [ -n "$MAJOR" ] && { [ "$MAJOR" -lt 8 ] || { [ "$MAJOR" -eq 8 ] && [ "$MINOR" -lt 5 ]; }; }; then
              JAVA_VER=17
            fi
            echo "Gradle wrapper ${GW:-unknown} -> Java ${JAVA_VER}"
          else
            echo "No Gradle wrapper found, defaulting to Java ${JAVA_VER}"
          fi
          echo "version=${JAVA_VER}" >> "$GITHUB_OUTPUT"

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: ${{ steps.jdk.outputs.version }}
          distribution: 'temurin'

      - name: Build Mod
        run: |
          chmod +x ./gradlew
          ./gradlew build

      - name: Parse Metadata
        id: meta
        shell: bash
        env:
          CF_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
        run: |
          set -euo pipefail
          JAR_PATH=$(ls build/libs/*.jar | grep -v "\-sources" | grep -v "\-dev" | grep -v "\-slim" | head -n 1 || true)
          if [ -z "$JAR_PATH" ]; then echo "Error: JAR not found"; exit 1; fi
          echo "jar_path=$JAR_PATH" >> "$GITHUB_OUTPUT"

          LOADER="forge"
          FULL_VER=""
          if unzip -l "$JAR_PATH" | grep -q "META-INF/neoforge.mods.toml"; then
            LOADER="neoforge"
            FULL_VER=$(unzip -p "$JAR_PATH" META-INF/neoforge.mods.toml | grep -E "^[[:space:]]*version=" | head -n 1 | cut -d'"' -f2 || true)
          elif unzip -l "$JAR_PATH" | grep -q "META-INF/mods.toml"; then
            LOADER="forge"
            FULL_VER=$(unzip -p "$JAR_PATH" META-INF/mods.toml | grep -E "^[[:space:]]*version=" | grep -v "^[[:space:]]*#" | head -n 1 | cut -d'"' -f2 || true)
          fi

          MOD_VER=$(echo "$FULL_VER" | cut -d'-' -f1)
          MC_VER=$(echo "$FULL_VER" | cut -d'-' -f2)

          if [ -z "$MC_VER" ]; then
            MC_VER=$(echo "$JAR_PATH" | grep -oE '[0-9]+\.[0-9]+(\.[0-9]+)?' | tail -n 1)
            MOD_VER=$(echo "$JAR_PATH" | sed "s/.*-\(.*\)-$MC_VER.jar/\1/")
            FULL_VER="${MOD_VER}-${MC_VER}"
          fi

          case "$LOADER" in
            neoforge) CF_LOADER_NAME="NeoForge"; CF_LOADER_FALLBACK=10150 ;;
            fabric)   CF_LOADER_NAME="Fabric";   CF_LOADER_FALLBACK=7499 ;;
            quilt)    CF_LOADER_NAME="Quilt";    CF_LOADER_FALLBACK=9153 ;;
            *)        CF_LOADER_NAME="Forge";    CF_LOADER_FALLBACK=7498 ;;
          esac

          CF_VERSIONS=$(curl -fsS -H "X-Api-Token: ${CF_TOKEN}" https://minecraft.curseforge.com/api/game/versions)
          cf_id() {
            echo "$CF_VERSIONS" | jq -r --arg n "$1" '[.[] | select(.name == $n)] | first | .id // empty'
          }

          CF_MC_ID=$(cf_id "$MC_VER")
          if [ -z "$CF_MC_ID" ]; then
            echo "Error: CurseForge has no game version named ${MC_VER}"
            exit 1
          fi

          CF_CLIENT_ID=$(cf_id "Client")
          CF_SERVER_ID=$(cf_id "Server")
          CF_LOADER_ID=$(cf_id "$CF_LOADER_NAME")
          : "${CF_CLIENT_ID:=9638}"
          : "${CF_SERVER_ID:=9639}"
          : "${CF_LOADER_ID:=$CF_LOADER_FALLBACK}"

          CF_VER_IDS=$(jq -cn --argjson mc "$CF_MC_ID" --argjson client "$CF_CLIENT_ID" --argjson server "$CF_SERVER_ID" --argjson loader "$CF_LOADER_ID" \
            '[ $mc, $client, $server, $loader ]')

          echo "loader=$LOADER" >> "$GITHUB_OUTPUT"
          echo "cf_ver_ids=$CF_VER_IDS" >> "$GITHUB_OUTPUT"
          echo "mc_ver=$MC_VER" >> "$GITHUB_OUTPUT"
          echo "mod_ver=$MOD_VER" >> "$GITHUB_OUTPUT"
          echo "full_ver=$FULL_VER" >> "$GITHUB_OUTPUT"
          echo "display_name=${MC_VER} v${MOD_VER}" >> "$GITHUB_OUTPUT"

          echo "Resolved jar=$JAR_PATH loader=$LOADER mc=$MC_VER mod=$MOD_VER full=$FULL_VER cf_versions=$CF_VER_IDS"

          echo "${{ github.event.head_commit.message }}" | sed '1d' > changelog.md
          if [ ! -s changelog.md ]; then
            git log --grep='^Bump version' --format='%B%x1e' | awk -v RS='\x1e' '/Fix #/ { print; exit }' | sed '1d' > changelog.md
          fi
          if [ ! -s changelog.md ]; then
            echo "See commit history." > changelog.md
          fi

      - name: Upload to CurseForge
        if: ${{ vars.CURSEFORGE_PROJECT != '' }}
        env:
          CF_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
          CF_PROJECT: ${{ vars.CURSEFORGE_PROJECT }}
        run: |
          set -euo pipefail
          METADATA=$(jq -n --arg cl "$(cat changelog.md)" --arg dn "${{ steps.meta.outputs.display_name }}" --argjson vs '${{ steps.meta.outputs.cf_ver_ids }}' \
            '{changelog: $cl, changelogType: "markdown", displayName: $dn, gameVersions: $vs, releaseType: "release"}')
          echo "CurseForge metadata=${METADATA}"
          HTTP=$(curl -sS -o /tmp/cf-upload.json -w "%{http_code}" -X POST \
            "https://minecraft.curseforge.com/api/projects/${CF_PROJECT}/upload-file" \
            -H "X-Api-Token: ${CF_TOKEN}" \
            -F "metadata=${METADATA}" \
            -F "file=@${{ steps.meta.outputs.jar_path }}")
          echo "CurseForge HTTP ${HTTP}"
          cat /tmp/cf-upload.json
          echo
          if [ "$HTTP" -ge 400 ]; then
            echo "CurseForge upload failed"
            exit 1
          fi

      - name: Upload to Modrinth
        if: ${{ vars.MODRINTH_PROJECT != '' }}
        env:
          MR_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          MR_PROJECT: ${{ vars.MODRINTH_PROJECT }}
        run: |
          set -euo pipefail
          FULL_VER="${{ steps.meta.outputs.full_ver }}"
          if curl -fsS "https://api.modrinth.com/v2/project/${MR_PROJECT}/version" \
            | jq -e --arg v "$FULL_VER" 'any(.[]; .version_number == $v)' >/dev/null; then
            echo "Modrinth already has ${FULL_VER}, skipping"
            exit 0
          fi
          METADATA=$(jq -n --arg name "${{ steps.meta.outputs.display_name }}" --arg ver "$FULL_VER" --arg cl "$(cat changelog.md)" --arg pid "${MR_PROJECT}" --arg mc "${{ steps.meta.outputs.mc_ver }}" --arg loader "${{ steps.meta.outputs.loader }}" \
            '{name: $name, version_number: $ver, changelog: $cl, dependencies: [], featured: false, status: "listed", game_versions: [$mc], version_type: "release", loaders: [$loader], project_id: $pid, file_parts: ["file"]}')
          HTTP=$(curl -sS -o /tmp/mr-upload.json -w "%{http_code}" -X POST \
            "https://api.modrinth.com/v2/version" \
            -H "Authorization: ${MR_TOKEN}" \
            -F "data=${METADATA}" \
            -F "file=@${{ steps.meta.outputs.jar_path }}")
          echo "Modrinth HTTP ${HTTP}"
          cat /tmp/mr-upload.json
          echo
          if [ "$HTTP" -ge 400 ]; then
            echo "Modrinth upload failed"
            exit 1
          fi
